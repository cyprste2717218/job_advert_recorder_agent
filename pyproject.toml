[project]
name = "job-tracker-agent"
version = "0.1.0"
description = "Job Advert Recorder Agent"
requires-python = ">=3.14"
dependencies = [
    "composio>=0.8",
    "google-adk>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "playwright>=1.45",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pyright>=1.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
