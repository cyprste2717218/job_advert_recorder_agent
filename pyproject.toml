[project]
name = "job-tracker-agent"
version = "0.1.0"
description = "Job Advert Recorder Agent"
requires-python = ">=3.14"
# playwright>=1.45 currently resolves to 1.61.0, which bundles Chromium
# build 1228 (Chrome 149.0.7827.55) via `playwright install chromium`.
dependencies = [
    "composio>=0.8",
    "google-adk>=2.0",
    "mcp>=1.24,<2",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "playwright>=1.45",
    "questionary>=2.0",
    "playwright-stealth>=2.0.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "uv>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
