[project]
name = "job-tracker-agent"
version = "0.1.0"
description = "Job Advert Recorder Agent"
requires-python = ">=3.14"
dependencies = [
    "composio>=0.8",
    "google-adk>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
